kind = "web"
previewPath = "/"
title = "DOP — Dev + Claude Cockpit"
version = "1.0.0"
id = "artifacts/dop"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23359

[services.development]
run = "pnpm --filter @workspace/dop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dop", "run", "build" ]
publicDir = "artifacts/dop/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23359"
BASE_PATH = "/"
